services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sahyog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: sahyog-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

  ml:
    build: ./ml
    container_name: sahyog-ml
    restart: unless-stopped
    # No postgres dependency and no `backend` network — the ML engine is
    # database-independent and must not be able to reach postgres.
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ml_net

  server:
    build: ./server
    container_name: sahyog-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8001
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:5173"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      MSG91_WIDGET_ID: ${MSG91_WIDGET_ID:-}
      MSG91_TOKEN_AUTH: ${MSG91_TOKEN_AUTH:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend
      - ml_net

  worker:
    build: ./server
    container_name: sahyog-worker
    restart: unless-stopped
    command: ["python", "-m", "arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8001
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - backend
      - ml_net

networks:
  backend:   # postgres, redis, server, worker — ml is never on this network
    driver: bridge
  ml_net:    # server, worker, ml — no postgres reachable here
    driver: bridge

volumes:
  pgdata:
  redisdata:
